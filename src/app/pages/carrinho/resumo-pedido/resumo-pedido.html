<aside>
  <section class="cartao resumo">
    <header class="resumo__cabecalho">
      <h2 class="cartao__titulo">Resumo do pedido</h2>
      <span class="resumo__contagem">{{ quantidadeItens() }} {{ quantidadeItens() === 1 ? 'unidade' : 'unidades' }}</span>
    </header>
    <div class="resumo__total">
      <span>Total</span>
      <strong>{{ total() | currency:'BRL':'symbol':'1.2-2':'pt-BR' }}</strong>
    </div>
    <button type="button" class="botao--principal">
      Finalizar compra
    </button>
  </section>
</aside>
